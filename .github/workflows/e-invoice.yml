name: E-Invoice Playwright

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: einvoice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: ERP API (QA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API suite
        env:
          CI: true
          EINV_BASE_URL: https://qa.gsthero.com
          EINV_GSTIN: ${{ secrets.EINV_GSTIN }}
          EINV_CONNECTOR_AUTH: ${{ secrets.EINV_CONNECTOR_AUTH }}
          EINV_BASIC_AUTH: ${{ secrets.EINV_BASIC_AUTH }}
          EINV_CLIENT_ID: ${{ secrets.EINV_CLIENT_ID }}
          EINV_CLIENT_SECRET: ${{ secrets.EINV_CLIENT_SECRET }}
          EINV_OAUTH_USER: ${{ secrets.EINV_OAUTH_USER }}
          EINV_OAUTH_PASS: ${{ secrets.EINV_OAUTH_PASS }}
          EINV_AUTH_USER: ${{ secrets.EINV_AUTH_USER }}
          EINV_AUTH_PASS: ${{ secrets.EINV_AUTH_PASS }}
        run: npm test

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: |
            api/playwright-report/
            api/test-results/
          retention-days: 14

  template:
    name: Template UI (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Template suite
        env:
          CI: true
          EINV_BASE_URL: https://dev.gsthero.com
          EINV_GSTIN: ${{ secrets.EINV_GSTIN }}
          EINV_UI_LOGIN_URL: https://dev.gsthero.com/GspModel/login
          EINV_UI_EMAIL: ${{ secrets.EINV_UI_EMAIL }}
          EINV_UI_PASSWORD: ${{ secrets.EINV_UI_PASSWORD }}
          EINV_OAUTH_USER: ${{ secrets.EINV_OAUTH_USER }}
          EINV_OAUTH_PASS: ${{ secrets.EINV_OAUTH_PASS }}
          EINV_AUTH_USER: ${{ secrets.EINV_AUTH_USER }}
          EINV_AUTH_PASS: ${{ secrets.EINV_AUTH_PASS }}
          EINV_TEMPLATE_CONNECTOR: "102"
        run: npm test

      - name: Upload Template report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-playwright-report
          path: |
            template/playwright-report/
            template/test-results/
          retention-days: 14

  email:
    name: Email report
    runs-on: ubuntu-latest
    needs: [api, template]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build Test Results email
        env:
          REPORT_ROOT: ${{ github.workspace }}/artifacts
          EMAIL_HTML: ${{ github.workspace }}/report-email.html
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/build-email-report.js

      - name: Send report email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[E-Invoice] Test Results — API ${{ needs.api.result }} / Template ${{ needs.template.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: file://${{ github.workspace }}/report-email.html
          secure: false
          ignore_cert: true
