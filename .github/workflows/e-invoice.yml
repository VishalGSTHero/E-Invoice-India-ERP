name: E-Invoice Playwright

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: einvoice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: ERP API (QA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API suite
        env:
          CI: true
          EINV_BASE_URL: https://qa.gsthero.com
          EINV_GSTIN: ${{ secrets.EINV_GSTIN }}
          EINV_CONNECTOR_AUTH: ${{ secrets.EINV_CONNECTOR_AUTH }}
          EINV_BASIC_AUTH: ${{ secrets.EINV_BASIC_AUTH }}
          EINV_CLIENT_ID: ${{ secrets.EINV_CLIENT_ID }}
          EINV_CLIENT_SECRET: ${{ secrets.EINV_CLIENT_SECRET }}
          EINV_OAUTH_USER: ${{ secrets.EINV_OAUTH_USER }}
          EINV_OAUTH_PASS: ${{ secrets.EINV_OAUTH_PASS }}
          EINV_AUTH_USER: ${{ secrets.EINV_AUTH_USER }}
          EINV_AUTH_PASS: ${{ secrets.EINV_AUTH_PASS }}
        run: npm test

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: |
            api/playwright-report/
            api/test-results/
          retention-days: 14

  template:
    name: Template UI (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Template suite
        env:
          CI: true
          EINV_BASE_URL: https://dev.gsthero.com
          EINV_GSTIN: ${{ secrets.EINV_GSTIN }}
          EINV_UI_LOGIN_URL: https://dev.gsthero.com/GspModel/login
          EINV_UI_EMAIL: ${{ secrets.EINV_UI_EMAIL }}
          EINV_UI_PASSWORD: ${{ secrets.EINV_UI_PASSWORD }}
          EINV_OAUTH_USER: ${{ secrets.EINV_OAUTH_USER }}
          EINV_OAUTH_PASS: ${{ secrets.EINV_OAUTH_PASS }}
          EINV_AUTH_USER: ${{ secrets.EINV_AUTH_USER }}
          EINV_AUTH_PASS: ${{ secrets.EINV_AUTH_PASS }}
          EINV_TEMPLATE_CONNECTOR: "102"
        run: npm test

      - name: Upload Template report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-playwright-report
          path: |
            template/playwright-report/
            template/test-results/
          retention-days: 14

  email:
    name: Email report
    runs-on: ubuntu-latest
    needs: [api, template]
    if: always()
    steps:
      - name: Write email body
        env:
          API_RESULT: ${{ needs.api.result }}
          TEMPLATE_RESULT: ${{ needs.template.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          cat > "$GITHUB_WORKSPACE/report-email.html" << EOF
          <html><body style="font-family:Segoe UI,Arial,sans-serif">
          <h2>E-Invoice India — GitHub Actions Report</h2>
          <p><b>Commit:</b> ${SHA:0:7}</p>
          <table border="1" cellpadding="6" cellspacing="0">
          <tr><th>Job</th><th>Result</th></tr>
          <tr><td>ERP API (QA)</td><td>${API_RESULT}</td></tr>
          <tr><td>Template UI (dev)</td><td>${TEMPLATE_RESULT}</td></tr>
          </table>
          <p><a href="${RUN_URL}">Open full report and artifacts on GitHub</a></p>
          </body></html>
          EOF

      - name: Send report email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[E-Invoice] API ${{ needs.api.result }} / Template ${{ needs.template.result }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          html_body: file://${{ github.workspace }}/report-email.html
          secure: false
          ignore_cert: true
